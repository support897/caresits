<!doctype html>
<html lang="en" data-theme="brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join Caresitters</title>
<meta name="description" content="Join Caresitters. Find care. Share the day.">
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="door.css">
</head>
<body>
<main class="doorWrap">
  <div class="doorCard">
    <img class="doorMark" src="../icon.svg" alt="The Caresitters heart">
    <h1 class="doorWord">Caresitters</h1>
    <p class="doorTag" data-i18n="door.tag">Find care. Share the day.</p>

    <div class="doorIcons">
      <button type="button" id="googleBtn" class="iconDoor" data-i18n-aria="door.google" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.5 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.5 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      </button>
      <button type="button" id="appleBtn" class="iconDoor" data-i18n-aria="door.apple" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#1E4D44" d="M17.05 12.54c-.03-2.89 2.36-4.27 2.47-4.34-1.35-1.97-3.44-2.24-4.18-2.27-1.78-.18-3.47 1.05-4.37 1.05-.9 0-2.29-1.02-3.77-1-1.94.03-3.72 1.13-4.72 2.86-2.01 3.49-.51 8.66 1.45 11.5.96 1.39 2.1 2.95 3.6 2.89 1.45-.06 2-.93 3.74-.93s2.24.93 3.77.9c1.56-.02 2.55-1.41 3.5-2.8 1.1-1.61 1.55-3.17 1.58-3.25-.04-.02-3.03-1.16-3.07-4.61zM14.16 4.06c.8-.97 1.34-2.31 1.19-3.65-1.15.05-2.55.77-3.38 1.73-.74.86-1.39 2.23-1.22 3.55 1.29.1 2.6-.65 3.41-1.63z"/></svg>
      </button>
    </div>

    <div id="step1">
      <label class="doorLabel" for="emailIn" data-i18n="door.email">Your email</label>
      <div class="emailRow">
        <input id="emailIn" class="doorInput" type="email" autocomplete="email" placeholder="you@example.com">
        <button type="button" id="nextBtn" class="roundNext" data-i18n-aria="door.next" aria-label="Next">→</button>
      </div>
    </div>

    <div id="step2" hidden>
      <p class="doorEmailLine"><span id="emailEcho"></span> <button type="button" id="changeBtn" class="changeBtn" data-i18n="door.change">Change</button></p>
      <label class="doorLabel" for="pwIn" data-i18n="door.password">Your password</label>
      <input id="pwIn" class="doorInput" type="password" autocomplete="current-password" data-i18n-ph="door.passwordPh" placeholder="Your own password">
      <button type="button" id="joinBtn" class="mainBtn doorJoin" data-i18n="door.join">Join Caresitters</button>
      <p class="doorForgot"><button type="button" id="forgotBtn" class="changeBtn" data-i18n="door.forgot">Forgot your password?</button></p>
    </div>

    <p id="doorMsg" class="doorMsg" role="status"></p>
    <p class="doorDemo"><button type="button" id="demoBtn" class="changeBtn" data-i18n="door.demo">Explore a demo first</button></p>
  </div>
</main>
<script type="module" src="door.js"></script>
</body>
</html>
