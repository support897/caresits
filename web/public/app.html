 const AU={id:"aupair",title:fam?"Au pair: what does your family offer?":"Au pair: what do you look for?",note:fam?"Tap what your family offers an au pair.":"Tap what you look for as an au pair.",picks:aup};

function setupView(edit){
 const S={step:0,side:null,types:[],name:"",pc:"",co:"Australia",ages:[],rate:30,err:""};
 if(edit&&prof){S.side=prof.side;S.types=prof.types.length?prof.types:["nanny"];S.name=prof.name==="Member"?"":prof.name;S.pc=prof.pc;S.ages=prof.kids||[];S.rate=prof.rate||30;S.step=3}
 const c0=(prof&&prof.card)||{};
 const A={lists:{},flags:{},nums:{},dev:JSON.parse(localStorage.getItem("csdev_"+me.uid)||"{}"),nat:c0.nationality||null,natList:[],natOnly:false,open:null};
 for(const k of ["personality","routineStyle","activities","languages","tasks"])if(Array.isArray(c0[k]))A.lists[k]=c0[k];
 for(const k of ["drives","ownCar","cooking","pets","petsOk"])if(c0[k]===true)A.flags[k]=true;
 for(const k of ["payOffered","payFloor"])if(typeof c0[k]==="number")A.nums[k]=c0[k];
 {const lk=(rawProf&&rawProf.looking)||{},mu=(lk.musts||{}).nationality,pr=(lk.prefs||{}).nationality;if(Array.isArray(mu)&&mu.length){A.natList=mu;A.natOnly=true}else if(Array.isArray(pr))A.natList=pr}
 const secs=()=>sections(S.side||"family",S.types),total=()=>3+secs().length,fam=()=>S.side==="family";
 const isOn=p=>{const h=p.home;if(h[0]==="list")return(A.lists[h[1]]||[]).includes(h[2]);if(h[0]==="flag")return!!A.flags[h[1]];if(h[0]==="dev")return!!A.dev[p.id];if(h[0]==="langs")return(A.lists.languages||[]).length>0;if(h[0]==="country")return fam()?A.natList.length>0:!!A.nat;if(h[0]==="onlynat")return A.natOnly;if(h[0]==="chips")return h[2]?A.nums[h[2]]!=null:typeof A.dev[p.id]==="string";return false};
 const tap=p=>{const h=p.home;
  if(h[0]==="list"){const l=A.lists[h[1]]||[],i=l.indexOf(h[2]);i<0?l.push(h[2]):l.splice(i,1);A.lists[h[1]]=l}

  else if(h[0]==="dev"){A.dev[p.id]=!A.dev[p.id];localStorage.setItem("csdev_"+me.uid,JSON.stringify(A.dev))}
  else if(h[0]==="onlynat")A.natOnly=!A.natOnly;
  else A.open=A.open===p.id?null:p.id};
 const opts=p=>p.home[0]==="langs"?LANGS:p.home[0]==="country"?NAT:p.home[1];
 const chipOn=(p,o)=>{const h=p.home;if(h[0]==="langs")return(A.lists.languages||[]).includes(o);if(h[0]==="country")return fam()?A.natList.includes(o):A.nat===o;if(h[2])return A.nums[h[2]]===+o.replace(/\D/g,"");return A.dev[p.id]===o};
 const chip=(p,o)=>{const h=p.home;
  if(h[0]==="langs"){const l=A.lists.languages||[],i=l.indexOf(o);i<0?l.push(o):l.splice(i,1);A.lists.languages=l}

  else{A.dev[p.id]=A.dev[p.id]===o?undefined:o;localStorage.setItem("csdev_"+me.uid,JSON.stringify(A.dev))}};
 const patch=()=>{const card={};for(const k of ["personality","routineStyle","activities","languages","tasks"])card[k]=(A.lists[k]||[]).length?A.lists[k]:null;for(const k of ["drives","ownCar","cooking","pets","petsOk"])card[k]=A.flags[k]?true:null;for(const k of ["payOffered","payFloor"])card[k]=A.nums[k]!=null?A.nums[k]:null;if(!fam())card.nationality=A.nat||null;
  const looking=fam()?(A.natOnly?{musts:{nationality:A.natList.length?A.natList:null},prefs:{nationality:null}}:{prefs:{nationality:A.natList.length?A.natList:null},musts:{nationality:null}}):null;return{card,looking}};
 const save=async skip=>{

  R.innerHTML=`<div class="authwrap"><div class="card wiz"><div class="bar">${Array.from({length:total()},(_,i)=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div><div class="wh">${bun()}<a href="#" id="sk">Skip for now</a></div><h2>${title}</h2><div class="mut">${sub}</div>${body}<div class="err" id="er">${esc(S.err)}</div><div class="row" style="margin-top:14px">${n>0?'<button class="btn ghost" id="bk">Back</button>':""}<button class="btn" id="go" style="flex:1">${last?"Finish":"Next"}</button></div></div></div>`;

async function saveProfile(o){
 const ref=doc(db,"profiles",me.uid),cur=(await getDoc(ref)).data()||{};
 const card={...(cur.card||{})};
 if(o.types){card.careTypes=o.types;card.maxDistanceKm=card.maxDistanceKm||15;card.auPairHost={country:o.country||"Australia"};
  if(o.side==="family"){card.kids=o.ages.slice(0,8).map(a=>({ageYears:a}));card.ageGroups=[...new Set(o.ages.map(a=>a<1?"newborn":a<2?"infant":a<4?"toddler":a<6?"preschool":"school"))]}else if(o.rate>0&&!(o.types.length===1&&o.types[0]==="au_pair"))card.rate=o.rate}
 if(o.card)for(const [k,v] of Object.entries(o.card)){if(v===null||v===undefined)delete card[k];else card[k]=v}
 const lk=JSON.parse(JSON.stringify(cur.looking||{musts:{},prefs:{}}));lk.musts=lk.musts||{};lk.prefs=lk.prefs||{};

 el.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"jobs",b.dataset.x),{state:"closed"}).catch(()=>{});urgent(el)});
}

/* ---------- bookings ---------- */
function bookForm(p){
 const d=new Date(Date.now()+864e5).toISOString().slice(0,10);
 R.insertAdjacentHTML("beforeend",`<div class="authwrap" id="bf" style="position:fixed;inset:0;z-index:50;background:rgba(45,42,53,.5)"><div class="card"><h2>Book ${esc(p.first)}</h2><label class="fld">Date</label><input id="bd" type="date" value="${d}"><label class="fld">From</label><input id="b1" type="time" value="09:00"><label class="fld">To</label><input id="b2" type="time" value="12:00"><label class="fld">Rate per hour</label><input id="br" type="number" value="${p.rate||35}"><div class="err" id="er"></div><button class="btn" id="bg" style="width:100%">Send request</button><p class="mut" style="text-align:center"><a href="#" id="bc">Cancel</a></p></div></div>`);
 $("#bc").onclick=e=>{e.preventDefault();$("#bf").remove()};
 $("#bg").onclick=async()=>{const date=$("#bd").value,from=$("#b1").value,to=$("#b2").value,rate=+$("#br").value;const m=t=>{const [h,mi]=t.split(":").map(Number);return h*60+mi};const hrs=Math.max(0,(m(to)-m(from))/60);
  const end=new Date(new Date(date+"T"+to+":00Z").getTime()-8*3600e3);if(!hrs||end<=new Date())return $("#er").textContent="Pick a future time with an end after the start";
  const pid=pairId(me.uid,p.id),rr=doc(db,"relationships",pid),br=doc(collection(db,"relationships",pid,"bookings")),ex=await getDoc(rr);const b=writeBatch(db);
  if(!ex.exists()){const iso=new Date().toISOString();b.set(rr,{members:[me.uid,p.id].sort(),familyUid:me.uid,carerUid:p.id,state:"pending",createdBy:me.uid,createdAt:iso,createdDay:iso.slice(0,10)})}else if(!["contact","hired"].includes(ex.data().state))return $("#er").textContent="Not available right now";
  b.set(br,{familyUid:me.uid,carerUid:p.id,date,from,to,endAt:Timestamp.fromDate(end),rate,estimate:Math.round(rate*hrs*100)/100,recurring:"none",weekdays:[],childIds:[],shareAddress:false,state:"requested",createdBy:me.uid,createdAt:serverTimestamp()});
  try{await b.commit();notify(p.id,"booking","New booking request.",pid);$("#bf").remove();toast("Request sent");tab="bookings";shell()}catch(e){$("#er").textContent="Could not book: "+e.code}};
}
async function bookings(el){
 loading(el);const q1=await getDocs(query(collection(db,"relationships"),where(prof.side==="family"?"familyUid":"carerUid","==",me.uid)));
 const rows=[];for(const r of q1.docs){const s=await getDocs(collection(db,"relationships",r.id,"bookings")).catch(()=>null);(s?s.docs:[]).forEach(d=>rows.push({id:d.id,pid:r.id,...d.data()}))}
 rows.sort((a,b)=>(b.date+b.from).localeCompare(a.date+a.from));
 const ppl={};await Promise.all([...new Set(rows.map(r=>prof.side==="family"?r.carerUid:r.familyUid))].map(async i=>{const x=await getDoc(doc(db,"profiles",i)).catch(()=>null);if(x&&x.exists())ppl[i]=person(i,x.data())}));
 const pay={},req={};await Promise.all(rows.map(async r=>{const q=await fetch(API+"/pay/status?bookingId="+r.id).then(x=>x.json()).catch(()=>({}));pay[r.id]=q.status||"unpaid";req[r.id]=!!q.requested}));
 el.innerHTML=`<h1>Bookings</h1>`+(rows.length?rows.map(r=>{const car=r.carerUid===me.uid,o=ppl[car?r.familyUid:r.carerUid];return `<div class="panel"><div class="row" style="margin:0"><b>${esc(o?.name||"Member")}</b><span class="pill ${r.state==="accepted"?"sun":""}">${esc(r.state)}</span>${pay[r.id]!=="unpaid"?`<span class="pill sky">${pay[r.id]==="held"?(req[r.id]?"Payment requested":"Paid, held safely"):pay[r.id]==="disputed"?"Under review":pay[r.id]==="refunded"?"Refunded":pay[r.id]==="split"?"Part refunded":pay[r.id]==="late_cancel"?"Part refunded":"Paid out"}</span>`:""}</div><div class="mut">${esc(r.date)}, ${esc(r.from)} to ${esc(r.to)} &middot; $${r.rate} an hour, about $${Math.round(r.estimate)}${pay[r.id]==="unpaid"&&!car?` &middot; plus service and payment fee $${(Math.round(r.estimate*15)/100+1).toFixed(2)}`:""}</div><div class="row">
  ${car&&r.state==="requested"?`<button class="btn sm" data-a="${r.id}|${r.pid}|accepted">Accept</button><button class="btn sm ghost" data-a="${r.id}|${r.pid}|declined">Decline</button>`:""}
  ${car&&pay[r.id]==="held"&&!req[r.id]?`<button class="btn sm pink" data-rq="${r.id}|${r.pid}">Request payment</button>`:""}${car&&req[r.id]&&pay[r.id]==="held"?`<span class="mut">Waiting for the family. It releases on its own in 24 hours.</span>`:""}
  ${["requested","accepted"].includes(r.state)?`<button class="btn sm ghost" data-a="${r.id}|${r.pid}|cancelled">Cancel</button>`:""}
  ${!car&&["accepted","completed"].includes(r.state)&&pay[r.id]==="unpaid"?`<button class="btn sm pink" data-p="${r.id}|${r.pid}">Pay now</button>`:""}
  ${!car&&pay[r.id]==="held"?`<button class="btn sm pink" data-rl="${r.id}|${r.pid}">Release to carer</button><button class="btn sm ghost" data-dp="${r.id}|${r.pid}">Report a problem</button>`:""}</div></div>`}).join(""):`<div class="empty">${bun()}<h3>No bookings yet</h3></div>`);
 el.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const [id,pid,to]=b.dataset.a.split("|");if(to==="cancelled"&&!confirm("Cancel this booking?\nFamily cancels 24 hours or more before: care price refunded, fee kept.\nFamily cancels under 24 hours: half the care price refunded, fee kept.\nCarer cancels: family gets everything back."))return;const u={state:to};if(to!=="cancelled"&&to!=="completed")u.decidedAt=serverTimestamp();
  try{const bt=writeBatch(db);bt.update(doc(db,"relationships",pid,"bookings",id),u);if(to==="accepted"){const rl=await getDoc(doc(db,"relationships",pid));if(rl.data()?.state==="pending")bt.update(doc(db,"relationships",pid),{state:"contact",contactBy:me.uid})}await bt.commit();
   const r=rows.find(x=>x.id===id);notify(r.familyUid===me.uid?r.carerUid:r.familyUid,"booking","Booking "+to+".",pid);if(to==="completed"||to==="cancelled")api("/stats/event",{pairId:pid,bookingId:id});if(to==="cancelled"){const rf=await api("/pay/cancel",{pairId:pid,bookingId:id}).catch(()=>({}));if(rf.status==="refunded")toast("Cancelled. Refund on its way");else if(rf.status==="late_cancel")toast("Cancelled. Part refund, carer keeps half")}bookings(el)}catch(e){toast("Could not update")}});
 el.querySelectorAll("[data-rq]").forEach(b=>b.onclick=async()=>{const [id,pid]=b.dataset.rq.split("|");const r=await api("/pay/request",{pairId:pid,bookingId:id});toast(r.ok?"Asked the family to release your pay":(r.error||"Could not request"));bookings(el)});
 el.querySelectorAll("[data-dp]").forEach(b=>b.onclick=async()=>{const [id,pid]=b.dataset.dp.split("|");const note=prompt("What went wrong? Caresitters will review within 2 working days.");if(note===null)return;const r=await api("/pay/dispute",{pairId:pid,bookingId:id,note});toast(r.ok?"Money frozen. We will review it.":(r.error||"Could not report"));bookings(el)});
 el.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const [id,pid]=b.dataset.p.split("|");if(!(await needTerms()))return;const r=await api("/pay/checkout",{pairId:pid,bookingId:id});if(r.url)location.href=r.url;else toast(r.error||"Payments are not on yet")});
 el.querySelectorAll("[data-rl]").forEach(b=>b.onclick=async()=>{const [id,pid]=b.dataset.rl.split("|");const r=await api("/pay/release",{pairId:pid,bookingId:id});toast(r.ok?"Released":(r.error||r.why||"Could not release"));bookings(el)});
}

 const fam=prof.side==="family";
 el.innerHTML=`<h1>Me</h1><div class="panel"><div class="row" style="margin:0"><div class="ph" style="width:72px;aspect-ratio:1;border-radius:50%;font-size:34px">${esc(prof.first[0])}</div><div><h3>${esc(prof.name)}</h3><div class="mut">${esc(me.email||"")}</div></div></div><div id="st" style="margin-top:8px"></div></div>

 <button class="btn ghost" id="pk" style="width:100%;margin-bottom:10px">Change what I am asking for</button>
 <button class="btn ghost" id="lo" style="width:100%">Log out</button>`;
 if($("#pk"))$("#pk").onclick=()=>setupView(true);
 fetch(API+"/stats?uid="+me.uid).then(r=>r.json()).then(s=>{$("#st").innerHTML=`<span class="pill sun">${s.done} jobs done</span><span class="pill sky">${s.done+s.cancelled?Math.round(s.done/(s.done+s.cancelled)*100)+"% completed":"New here"}</span>${s.strikes?`<span class="pill">${s.strikes} strike${s.strikes>1?"s":""}${s.status==="paused"?" (paused)":s.status==="closed"?" (closed)":""}</span>`:""}`}).catch(()=>{});
 $("#sv").onclick=async()=>{const nm=$("#nm").value.trim(),ab=$("#ab").value.trim();if(bad(nm+" "+ab))return $("#er").textContent="No emails or phone numbers";const card={};if(fam){card.kids=($("#ak").value.match(/\d+/g)||[]).slice(0,8).map(a=>({ageYears:+a}))}else{if(+$("#rt").value>0)card.rate=+$("#rt").value;card.experienceYears=Math.max(0,Math.min(60,+$("#yr").value||0))}
  try{await saveProfile({name:nm,postcode:$("#pc").value.trim(),about:ab,card});await loadProf();toast("Saved");shell()}catch(e){$("#er").textContent="Could not save: "+e.code}};
 if($("#po"))$("#po").onclick=async()=>{if(!(await needTerms()))return;const r=await api("/pay/onboard",{});if(r.url)location.href=r.url;else toast(r.error||"Payments are not on yet")};
 if($("#po"))api("/pay/ready",{}).then(r=>{if(r.ready){$("#po").parentElement.innerHTML="<b>Get paid</b><p class=\"mut\">Payouts are ready. Families pay safely and you get paid when the job is done. Your first payout can take longer.</p><span class=\"pill sky\">Payouts ready</span>"}}).catch(()=>{});
 $("#lo").onclick=()=>signOut(auth);
}

async function boot(){await loadProf();if(!prof||!prof.side)return setupView();await loadHearts();shell()}
{const q=new URLSearchParams(location.search).get("pay");if(q){history.replaceState(null,"",location.pathname);setTimeout(()=>toast(q==="done"?"Done. Thank you.":q==="cancel"?"Payment cancelled. No charge.":"Please finish setup"),1500)}}
onAuthStateChanged(auth,async u=>{me=u;if(!u){if(unsub){unsub();unsub=null}return authView(location.hash==="#signup"?"signup":"login")}try{await boot()}catch(e){R.innerHTML=`<div class="empty">${bun()}<h3>Something went wrong</h3><p>${esc(e.code||e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`}});
