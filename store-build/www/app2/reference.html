<!doctype html>
<html lang="en" data-theme="brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Write a reference · Caresitters</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="door.css">
<style>
  .refCard{max-width:460px;margin:24px auto;padding:20px;background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08);font-family:system-ui,sans-serif;color:#1f4f45}
  .refCard h1{font-size:24px;margin:8px 0}
  .refCard label{display:block;font-weight:600;margin:14px 0 6px}
  .refCard input,.refCard textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #cfe0db;border-radius:10px}
  .refStars button{font-size:32px;background:none;border:0;cursor:pointer;color:#c9c9c9;padding:0 4px}
  .refStars button.on{color:#e0a100}
  .refGo{margin-top:18px;width:100%;padding:14px;border:0;border-radius:999px;background:#1f4f45;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
  .refMsg{margin-top:12px;font-weight:600}
  .refNote{font-size:13px;color:#4a6b63}
</style>
</head>
<body>
<main class="refCard">
  <img src="../icon.svg" alt="" width="48" height="48">
  <h1 id="title">Write a reference</h1>
  <p id="intro" class="refNote">Thank you for helping. It takes one minute. No account needed.</p>
  <form id="form" hidden>
    <label for="name">Your first name</label>
    <input id="name" maxlength="40" autocomplete="given-name">
    <label for="rel">How do you know them?</label>
    <input id="rel" maxlength="40" placeholder="Example: I was their host family">
    <label>How was it?</label>
    <div class="refStars" id="stars"></div>
    <label for="text">A few words</label>
    <textarea id="text" rows="4" maxlength="500" placeholder="What did they do well? Would you trust them with your kids again?"></textarea>
    <button class="refGo" id="go" type="submit">Send reference</button>
    <p class="refMsg" id="msg" role="status"></p>
    <p class="refNote">Your name and words will show on their profile as a reference from a link. Caresitters does not check who you are.</p>
  </form>
</main>
<script type="module" src="reference.js"></script>
</body>
</html>
