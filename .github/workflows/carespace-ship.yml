name: CareSpace ship to TestFlight (carespace-29)

# Ilse's order 2026-11-15 ("push to TestFlight and repo"). Fires when this
# file or native-carespace/SHIP-TRIGGER.txt changes on carespace-29.
# Signing: fastlane cert + sigh through the App Store Connect API key
# (Apple Distribution cert + App Store profile for com.ilse.carespace),
# then manual-signed archive, export, upload to TestFlight.
# Does NOT submit to App Review.

on:
  push:
    branches: [carespace-29]
    paths:
      - ".github/workflows/carespace-ship.yml"
      - "native-carespace/SHIP-TRIGGER.txt"

env:
  PROFILE_NAME: "CareSpace AppStore CI"
  BUNDLE_ID: com.ilse.carespace
  TEAM_ID: GZ9Z6BPTFR

jobs:
  ship:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the project from the repo tree
        run: |
          mkdir -p cs-ci/UITests
          cp -R native-carespace/Sources cs-ci/Sources
          cp -R native-carespace/Assets.xcassets cs-ci/Assets.xcassets
          cp -R native-carespace/Fonts cs-ci/Fonts
          cp native-carespace/Info.plist native-carespace/App.entitlements native-carespace/ActivitiesCatalogue.json native-carespace/LaunchScreen.storyboard cs-ci/
          cp store-build/carespace-GoogleService-Info.plist cs-ci/GoogleService-Info.plist
          cp native-carespace/ci/UITests/CareSpaceFlowTests.swift cs-ci/UITests/
          cp native-carespace/ci/genproj_test.py cs-ci/

      - name: Generate the project and switch the app target to manual signing
        working-directory: cs-ci
        run: |
          python3 genproj_test.py
          python3 - <<'PY'
          import re
          p='CareSpace.xcodeproj/project.pbxproj'
          s=open(p).read()
          n=0
          def fix(m):
              global n
              b=m.group(0)
              if 'CODE_SIGN_ENTITLEMENTS' in b:
                  n+=1
                  b=b.replace('CODE_SIGN_STYLE = Automatic;','CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = "Apple Distribution"; PROVISIONING_PROFILE_SPECIFIER = "CareSpace AppStore CI";')
              return b
          s=re.sub(r'buildSettings = \{.*?\n\t\t\t\};',fix,s,flags=re.S)
          open(p,'w').write(s)
          print('patched app configs:',n)
          PY
          grep -n "PROVISIONING_PROFILE_SPECIFIER" CareSpace.xcodeproj/project.pbxproj | head
          xcodebuild -version

      - name: API key files
        env:
          KEY_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          python3 - <<'PY'
          import json,os
          d=os.environ['RUNNER_TEMP']
          key=open(f"{d}/keys/AuthKey_{os.environ['KEY_ID']}.p8").read()
          json.dump({"key_id":os.environ['KEY_ID'],"issuer_id":os.environ['ISSUER_ID'],"key":key,"in_house":False},open(f"{d}/keys/api_key.json","w"))
          PY
          echo "API_JSON=$RUNNER_TEMP/keys/api_key.json" >> $GITHUB_ENV
          echo "BUILD_NO=$(date -u +%y%m%d%H%M)" >> $GITHUB_ENV

      - name: Distribution certificate and App Store profile (fastlane)
        run: |
          fastlane --version | tail -1
          fastlane run setup_ci
          fastlane run cert api_key_path:"$API_JSON" team_id:"$TEAM_ID" 2>&1 | tail -30
          fastlane run sigh api_key_path:"$API_JSON" app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" provisioning_name:"$PROFILE_NAME" force:true 2>&1 | tail -30
          security find-identity -v -p codesigning

      - name: Archive
        working-directory: cs-ci
        run: |
          set -o pipefail
          xcodebuild archive -project CareSpace.xcodeproj -scheme CareSpace \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CareSpace.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NO" 2>&1 | tee archive.log | tail -40

      - name: Export ipa
        working-directory: cs-ci
        run: |
          set -o pipefail
          cat > export.plist <<'P'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>GZ9Z6BPTFR</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.ilse.carespace</key><string>CareSpace AppStore CI</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          P
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CareSpace.xcarchive" \
            -exportOptionsPlist export.plist \
            -exportPath "$RUNNER_TEMP/export" 2>&1 | tee export.log | tail -40
          ls "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          fastlane run upload_to_testflight api_key_path:"$API_JSON" ipa:"$IPA" skip_waiting_for_build_processing:true 2>&1 | tail -40

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carespace-ship-logs
          path: |
            cs-ci/archive.log
            cs-ci/export.log
          if-no-files-found: warn
