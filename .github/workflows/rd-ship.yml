name: Redesign ship to TestFlight (build-182)

# Fires when native/SHIP-TRIGGER.txt changes on build-182.
# Cloud managed signing: xcodebuild asks Apple for the distribution signing through the
# App Store Connect API key, so no certificate is stored on the runner.
# Uploads to TestFlight. Does NOT submit to App Review.

on:
  push:
    branches: [build-182]
    paths:
      - "native/SHIP-TRIGGER.txt"

env:
  TEAM_ID: GZ9Z6BPTFR

jobs:
  ship:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Write Firebase config from secret
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then echo "GOOGLE_SERVICE_INFO_PLIST_B64 secret is not set"; exit 1; fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > native/GoogleService-Info.plist

      - name: Generate the project
        working-directory: native
        run: |
          python3 genproj.py
          xcodebuild -version

      - name: API key file
        env:
          KEY_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" >> $GITHUB_ENV
          echo "KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "ISSUER_ID=$ISSUER_ID" >> $GITHUB_ENV
          echo "BUILD_NO=$(date -u +%y%m%d%H%M)" >> $GITHUB_ENV

      - name: Archive
        working-directory: native
        run: |
          xcodebuild archive -project Caresitters.xcodeproj -scheme Caresitters \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Caresitters.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NO" > archive.log 2>&1 || true
          tail -5 archive.log
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Sign embedded frameworks so export can re-sign them
        run: |
          APP="$RUNNER_TEMP/Caresitters.xcarchive/Products/Applications/Caresitters.app"
          find "$APP/Frameworks" -maxdepth 1 -name "*.framework" -exec codesign --force --sign - --timestamp=none {} \;
          ls "$APP/Frameworks" | head -20

      - name: Archive errors
        if: failure()
        working-directory: native
        run: grep -E "error:|Error" archive.log | sort -u | head -40 | while read l; do echo "::error::$l"; done

      - name: Export and upload to TestFlight
        working-directory: native
        run: |
          cat > export.plist <<'P'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>GZ9Z6BPTFR</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          P
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Caresitters.xcarchive" \
            -exportOptionsPlist export.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" > export.log 2>&1 || true
          tail -15 export.log
          grep -qiE "EXPORT SUCCEEDED|Upload succeeded" export.log && ! grep -qE "error:|Error Domain" export.log

      - name: Export errors
        if: failure()
        working-directory: native
        run: grep -E "error:|Error|rror Domain" export.log | sort -u | head -30 | while read l; do echo "::error::$l"; done

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ship-logs
          path: |
            native/archive.log
            native/export.log
          if-no-files-found: warn
